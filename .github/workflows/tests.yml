name: Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-main
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
